name: Cleanup

on:
  workflow_call:
    inputs:
      package-name:
        description: GitHub Container Registry package name
        required: true
        type: string
      target-environment:
        description: Environment prefix whose old images may be removed
        required: true
        type: string
      keep-tag:
        description: Exact tag identifying the newly built package version
        required: true
        type: string
      retain-count:
        description: Number of tagged image versions to retain for this environment
        required: false
        type: number
        default: 3

permissions:
  contents: read
  packages: write

jobs:
  cleanup:
    name: Remove superseded GHCR images
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete superseded tagged package versions
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          PACKAGE_NAME: ${{ inputs.package-name }}
          TARGET_ENVIRONMENT: ${{ inputs.target-environment }}
          KEEP_TAG: ${{ inputs.keep-tag }}
          RETAIN_COUNT: ${{ inputs.retain-count }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const packageName = process.env.PACKAGE_NAME;
            const targetEnvironment = process.env.TARGET_ENVIRONMENT;
            const keepTag = process.env.KEEP_TAG;
            const retainCount = Number.parseInt(process.env.RETAIN_COUNT, 10);
            const ownerType = context.payload.repository?.owner?.type;
            const isOrganization = ownerType === "Organization";

            if (!/^(dev|staging|prod)$/.test(targetEnvironment)) {
              core.setFailed(`Unsupported target environment: ${targetEnvironment}`);
              return;
            }

            if (!Number.isInteger(retainCount) || retainCount < 1 || retainCount > 20) {
              core.setFailed(`retain-count must be an integer from 1 through 20; got ${process.env.RETAIN_COUNT}.`);
              return;
            }

            const environmentTagPrefix = `${targetEnvironment}-sha-`;
            const expectedKeepTag = new RegExp(
              `^${targetEnvironment}-sha-[0-9a-f]{40}-run-[0-9]+-[0-9]+$`,
            );
            if (!expectedKeepTag.test(keepTag)) {
              core.setFailed(
                `Refusing keep tag ${keepTag}; expected an immutable ${targetEnvironment} build tag.`,
              );
              return;
            }

            async function listVersions() {
              const endpoint = isOrganization
                ? github.rest.packages.getAllPackageVersionsForPackageOwnedByOrg
                : github.rest.packages.getAllPackageVersionsForPackageOwnedByUser;
              const ownerParameter = isOrganization ? { org: owner } : { username: owner };

              return github.paginate(endpoint, {
                ...ownerParameter,
                package_type: "container",
                package_name: packageName,
                per_page: 100,
              });
            }

            let versions = [];
            let currentVersions = [];

            // GHCR can take a few seconds to expose a freshly pushed version via the API.
            for (let attempt = 1; attempt <= 6; attempt += 1) {
              versions = await listVersions();
              currentVersions = versions.filter((version) =>
                (version.metadata?.container?.tags ?? []).includes(keepTag),
              );

              if (currentVersions.length === 1) break;
              if (attempt < 6) await new Promise((resolve) => setTimeout(resolve, 10000));
            }

            if (currentVersions.length !== 1) {
              core.setFailed(
                `Expected exactly one ${packageName} version tagged ${keepTag}; ` +
                `found ${currentVersions.length}. No versions were deleted.`,
              );
              return;
            }

            const currentVersionId = currentVersions[0].id;
            const environmentVersions = versions
              .filter((version) =>
                (version.metadata?.container?.tags ?? []).some((tag) =>
                  tag.startsWith(environmentTagPrefix),
                ),
              )
              .sort((left, right) =>
                new Date(right.created_at).getTime() - new Date(left.created_at).getTime(),
              );

            // Always retain the freshly published version, even if GHCR returns
            // versions in an unexpected order, then retain the newest rollback images.
            const retainedVersionIds = new Set([currentVersionId]);
            for (const version of environmentVersions) {
              if (retainedVersionIds.size >= retainCount) break;
              retainedVersionIds.add(version.id);
            }

            // Buildx publishes an OCI index whose platform image and provenance
            // attestations are separate, untagged package versions. Deleting
            // those versions leaves the tagged index pointing at missing
            // manifests, so cleanup only targets tagged roots belonging to the
            // selected environment and never touches another environment.
            const obsoleteVersions = environmentVersions.filter(
              (version) => !retainedVersionIds.has(version.id),
            );
            const retainedUntaggedVersions = versions.filter(
              (version) => (version.metadata?.container?.tags ?? []).length === 0,
            );

            for (const version of obsoleteVersions) {
              const endpoint = isOrganization
                ? github.rest.packages.deletePackageVersionForOrg
                : github.rest.packages.deletePackageVersionForUser;
              const ownerParameter = isOrganization ? { org: owner } : { username: owner };

              await endpoint({
                ...ownerParameter,
                package_type: "container",
                package_name: packageName,
                package_version_id: version.id,
              });
              core.info(`Deleted package version ${version.id}.`);
            }

            core.info(
              `Kept ${retainedVersionIds.size} ${targetEnvironment} version(s), including ` +
              `${currentVersionId} tagged ${keepTag}; deleted ${obsoleteVersions.length} older ` +
              `${targetEnvironment} version(s); ` +
              `retained ${retainedUntaggedVersions.length} OCI child manifest(s).`,
            );

      - name: Verify retained image is pullable on linux/amd64
        shell: bash
        env:
          OWNER: ${{ github.repository_owner }}
          PACKAGE_NAME: ${{ inputs.package-name }}
          KEEP_TAG: ${{ inputs.keep-tag }}
        run: |
          image="ghcr.io/${OWNER,,}/${PACKAGE_NAME}:${KEEP_TAG}"
          docker pull --platform linux/amd64 "$image"

name: Build and push

on:
  workflow_call:
    inputs:
      target_environment:
        required: true
        type: string
      push:
        required: false
        type: boolean
        default: false
    outputs:
      image:
        description: Fully qualified container image name
        value: ${{ jobs.build.outputs.image }}
      tag:
        description: Immutable tag attached to this build
        value: ${{ jobs.build.outputs.tag }}
      digest:
        description: Container image digest
        value: ${{ jobs.build.outputs.digest }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Container image
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.target_environment }}
    outputs:
      image: ${{ steps.image.outputs.name }}
      tag: ${{ steps.image.outputs.tag }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Define immutable image coordinates
        id: image
        shell: bash
        env:
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
        run: |
          [[ "$TARGET_ENVIRONMENT" =~ ^(dev|staging|prod)$ ]] || {
            echo "Unsupported target environment: $TARGET_ENVIRONMENT" >&2
            exit 1
          }

          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tag="${TARGET_ENVIRONMENT}-sha-${GITHUB_SHA}-run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "name=$image" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GitHub Container Registry
        if: inputs.push
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ steps.image.outputs.tag }}
            type=raw,value=${{ inputs.target_environment }}
            type=raw,value=latest,enable=${{ inputs.target_environment == 'prod' }}

      - name: Validate environment build variables
        shell: bash
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_WS_URL: ${{ vars.VITE_WS_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
        run: |
          for variable_name in VITE_API_URL VITE_WS_URL VITE_GOOGLE_CLIENT_ID; do
            [[ -n "${!variable_name:-}" ]] || {
              echo "GitHub environment variable $variable_name is not configured." >&2
              exit 1
            }
          done

      - name: Build and optionally push image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
            VITE_WS_URL=${{ vars.VITE_WS_URL }}
            VITE_REFRESH_INTERVAL_MS=240000
            VITE_REFRESH_SKEW_MS=60000
            VITE_GOOGLE_CLIENT_ID=${{ vars.VITE_GOOGLE_CLIENT_ID }}
          push: ${{ inputs.push }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: mode=min
          cache-from: type=gha
          cache-to: type=gha,mode=max
